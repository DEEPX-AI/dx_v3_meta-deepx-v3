# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-deepx-v3"
BBFILE_PATTERN_meta-deepx-v3 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-deepx-v3 = "6"

LAYERDEPENDS_meta-deepx-v3 = "core"
LAYERSERIES_COMPAT_meta-deepx-v3 = "scarthgap"
