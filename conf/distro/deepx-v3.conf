# DEEPX Linux Distribution Configuration
#
# This is the DEEPX custom distribution based on Poky reference distribution
# Optimized for embedded ISP camera systems
#
# Supports both systemd and busybox init managers
# Set VIRTUAL-RUNTIME_init_manager in local.conf to choose:
#   VIRTUAL-RUNTIME_init_manager = "systemd"  (default)
#   VIRTUAL-RUNTIME_init_manager = "busybox"

require conf/distro/poky.conf

# ============================================================================
# Basic Distribution Information
# ============================================================================
DISTRO = "deepx-v3"
DISTRO_NAME = "DEEPX Linux"
DISTRO_VERSION = "3.0"
DISTRO_CODENAME = "v3"
MAINTAINER = "DEEPX <support@deepx.ai>"

# ============================================================================
# SDK and Toolchain Configuration
# ============================================================================
SDK_VENDOR = "-deepxsdk"
SDK_VERSION = "${@d.getVar('DISTRO_VERSION').replace('snapshot-${METADATA_REVISION}', 'snapshot')}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"
TARGET_VENDOR = "-deepx"

# ============================================================================
# Package Management
# ============================================================================
# Use IPK (opkg) for embedded systems - lightweight and optimized
PACKAGE_CLASSES ?= "package_ipk"

# ============================================================================
# Build Dependencies
# ============================================================================
# Always build deepx-tools-native for image generation (not SDK)
EXTRA_IMAGEDEPENDS:append = " deepx-tools-native"

# ============================================================================
# Init System Configuration
# ============================================================================
# Default to systemd if not specified in local.conf
VIRTUAL-RUNTIME_init_manager ??= "systemd"

# Conditional configuration based on init manager
# systemd configuration
DISTRO_FEATURES:append = "${@' systemd usrmerge pam' if d.getVar('VIRTUAL-RUNTIME_init_manager') == 'systemd' else ' usrmerge'}"
DISTRO_FEATURES:remove = "${@' sysvinit' if d.getVar('VIRTUAL-RUNTIME_init_manager') == 'systemd' else ' systemd sysvinit pam'}"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " systemd sysvinit"

# Virtual runtime providers - conditional on init manager
VIRTUAL-RUNTIME_initscripts = "${@'systemd-compat-units' if d.getVar('VIRTUAL-RUNTIME_init_manager') == 'systemd' else ''}"
VIRTUAL-RUNTIME_login_manager = "${@'shadow' if d.getVar('VIRTUAL-RUNTIME_init_manager') == 'systemd' else 'busybox'}"
VIRTUAL-RUNTIME_base-utils = "busybox"
VIRTUAL-RUNTIME_base-utils-hwclock = "${@'util-linux-hwclock' if d.getVar('VIRTUAL-RUNTIME_init_manager') == 'systemd' else 'busybox-hwclock'}"
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Preferred provider for init
PREFERRED_PROVIDER_virtual/init = "${VIRTUAL-RUNTIME_init_manager}"

# ============================================================================
# User Account Configuration
# ============================================================================
# Default root password (change for production!)
# Password hash generated with: openssl passwd -6 <password>
LINUX_ACCOUNT_ROOT_PASSWD_HASH ?= "\$6\$hrRGEChzrPLlxYK0\$04tWoX80PsKgZW2Kzb7IfwpuYyC.iVP4uGx7ZztxboJ7P12sz2pwbi.eZ7YL8c/QFTxiR3VX1sZL/8Ichwakm."

# Default user account
LINUX_ACCOUNT_USER_NAME ?= "deepx"
LINUX_ACCOUNT_USER_PASSWD_HASH ?= "\$6\$hrRGEChzrPLlxYK0\$04tWoX80PsKgZW2Kzb7IfwpuYyC.iVP4uGx7ZztxboJ7P12sz2pwbi.eZ7YL8c/QFTxiR3VX1sZL/8Ichwakm."
LINUX_ACCOUNT_USER_GROUPS ?= "sudo,wheel"

# Auto login configuration
# Set LINUX_ACCOUNT_ROOT_AUTOLOGIN="1" for root auto login
# Set LINUX_ACCOUNT_USER_AUTOLOGIN="1" for user auto login (requires USER_NAME and USER_PASSWD_HASH)
# Root takes priority if both are set
LINUX_ACCOUNT_ROOT_AUTOLOGIN ?= ""
LINUX_ACCOUNT_USER_AUTOLOGIN ?= "1"
LINUX_ACCOUNT_AUTOLOGIN_TTY ?= "ttyAMA0"

# ============================================================================
# Data Partition Configuration
# ============================================================================
# Enable data partition auto-mount:
IMAGE_DATA_PART_DEVICE_NODE ?= "/dev/mmcblk2p3"

# Wait retries (120 × 1s = 120s)
IMAGE_DATA_PART_WAIT_TIME ?= "3"

# Mount options for data partition
IMAGE_DATA_PART_MOUNT_OPTIONS ?= "defaults,noatime,nofail"

# ============================================================================
# Distro Features - Remove Unnecessary Features for Embedded Camera
# ============================================================================

# Graphics/Display (headless ISP camera - no display)
DISTRO_FEATURES:remove = " x11 wayland vulkan opengl"

# Audio (no audio on ISP camera)
# DISTRO_FEATURES:remove = " pulseaudio alsa"

# Wireless/Connectivity (wired camera only)
DISTRO_FEATURES:remove = " bluetooth wifi 3g nfc"

# Desktop/UI features (embedded headless system)
DISTRO_FEATURES:remove = " pcmcia usbgadget zeroconf"

# ============================================================================
# Build Optimization (Optional)
# ============================================================================
# Uncomment to remove work directory after build to save disk space
# INHERIT += "rm_work"

# Uncomment for reproducible builds
# INHERIT += "reproducible_build"

# ============================================================================
# Development vs Production Settings
# ============================================================================
# Development features (enable for debugging)
# EXTRA_IMAGE_FEATURES ?= "debug-tweaks tools-debug tools-profile"

# Production settings (uncomment for production builds)
# EXTRA_IMAGE_FEATURES = ""
# INHIBIT_PACKAGE_DEBUG_SPLIT = "1"
# INHIBIT_PACKAGE_STRIP = "0"

# ============================================================================
# Legal Compliance
# ============================================================================
# Accept commercial licenses for GStreamer libav plugin
LICENSE_FLAGS_ACCEPTED ?= "commercial"

# ============================================================================
# Version Pinning (Optional)
# ============================================================================
# Uncomment to pin specific versions for stability
# PREFERRED_VERSION_linux-yocto ?= "6.1%"
# PREFERRED_VERSION_systemd ?= "255%"
