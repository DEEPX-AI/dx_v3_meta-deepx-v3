# DEEPX V3 Configuration for v3-evb Machine
#
# Machine-specific settings for v3-evb
# Select init system and image type using includes

header:
  version: 14
  includes:
    - deepx-v3.yml

# Override machine setting
machine: v3-evb

local_conf_header:
  # Machine configuration
  machine_config: |
    MACHINE = "v3-evb"

  # Package management
  package: |
    PACKAGE_CLASSES = "package_deb"

  # DEEPX hardware support packages
  deepx_isp: |
    # ISP (Image Signal Processor)
    IMAGE_INSTALL:append = " isp-vsi-lib isp-vsi-module"
    # Enable ISP VSI daemon
    ISP_VSI_DAEMON_ENABLE = "1"

  # Multimedia framework
  multimedia: |
    # V4L2 utilities and video device controls
    IMAGE_INSTALL:append = " v4l-utils"

    # GStreamer multimedia framework with plugins
    IMAGE_INSTALL:append = " gstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
    IMAGE_INSTALL:append = " gstreamer1.0-plugins-bad gstreamer1.0-libav"
    PACKAGECONFIG:append:pn-gstreamer1.0-plugins-bad = " kms"

    # DRM library for display support
    IMAGE_INSTALL:append = " libdrm libdrm-tests"
    PACKAGECONFIG:pn-libdrm = " tests install-test-programs"

    # FFmpeg multimedia framework (optional)
    # IMAGE_INSTALL:append = " ffmpeg libavcodec libavformat libavutil libavfilter libswscale"

  # Development tools
  tools: |
    # Android ADB daemon for USB debugging
    IMAGE_INSTALL:append = " android-tools-adbd udc-helper"
    # Device tools
    IMAGE_INSTALL:append = " net-tools netplan"
    IMAGE_INSTALL:append = " openssh nfs-utils-client"
    IMAGE_INSTALL:append = " usbutils hdparm"
